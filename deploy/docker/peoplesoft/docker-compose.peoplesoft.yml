services:
  # Standalone PeopleSoft HRMS Backend API
  hrms-api:
    build:
      context: ../../../
      dockerfile: deploy/docker/services/hrms-api.Dockerfile
    env_file:
      - "../../../services/hrms Multi-terent/.env"
    environment:
      NODE_ENV: production
      PORT: 5001
      BACKEND_URL: "${PUBLIC_BASE_URL:-http://localhost}/hrms-api"
      MONGO_URI: "${MONGO_URI:-mongodb+srv://peoplesoft_db_user:jdaKGQQTcmvIFyCl@peoplesoft.rjdu5de.mongodb.net/}"
    expose:
      - "5001"
    restart: unless-stopped

  # Standalone PeopleSoft Frontend & Reverse Proxy
  peoplesoft-web:
    build:
      context: ../../../
      dockerfile: deploy/docker/peoplesoft/peoplesoft-gateway.Dockerfile
    depends_on:
      - hrms-api
    ports:
      - "${PEOPLESOFT_PORT:-80}:80"
    restart: unless-stopped
