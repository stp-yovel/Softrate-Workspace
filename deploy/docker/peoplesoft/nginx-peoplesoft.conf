server {
  listen 80;
  listen [::]:80;
  server_name _;

  client_max_body_size 50M;

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;

    location = /index.html {
      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
      add_header Pragma "no-cache" always;
      expires 0;
    }
  }

  # Legacy reset password endpoint
  location = /reset-password.html {
    proxy_pass http://hrms-api:5001/reset-password.html;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # HRMS WebSocket Support
  location ^~ /hrms-api/socket.io/ {
    rewrite ^/hrms-api/(.*)$ /$1 break;
    proxy_pass http://hrms-api:5001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
  }

  # HRMS API Reverse Proxy
  location ^~ /hrms-api/ {
    rewrite ^/hrms-api/(.*)$ /$1 break;
    proxy_pass http://hrms-api:5001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  location ^~ /api/ {
    proxy_pass http://hrms-api:5001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }
}
