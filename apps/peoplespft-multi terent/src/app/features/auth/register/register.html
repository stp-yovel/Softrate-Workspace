<div class="login-container">
  <!-- Left Branding Panel -->
  <div class="branding-panel">
    <div class="branding-header">
      <div class="logo-container">
        <img src="logo/peoplesoft.png" alt="peoplesoft Logo" class="brand-logo-img">
        <div class="logo-text">PeopleSoft</div>
      </div>
      <span class="crm-tag">Workforce Management</span>
    </div>

    <div class="branding-footer-content">
      <h1>Run the whole organization from one place.</h1>
      <p class="branding-desc">Empowering your team with smart automation. Manage attendance, leave, and performance in one unified workspace.</p>
    </div>

    <!-- Constellation / network node graphics -->
    <svg class="constellation-svg" viewBox="0 0 320 320" fill="none" xmlns="http://www.w3.org/2000/svg">
      <line x1="40" y1="280" x2="110" y2="210" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
      <line x1="110" y1="210" x2="210" y2="250" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
      <line x1="110" y1="210" x2="150" y2="120" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
      <line x1="150" y1="120" x2="250" y2="150" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
      <line x1="210" y1="250" x2="280" y2="190" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
      <line x1="250" y1="150" x2="280" y2="190" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
      <circle cx="40" cy="280" r="4" fill="rgba(255,255,255,0.6)"/>
      <circle cx="110" cy="210" r="5" fill="rgba(255,255,255,0.85)"/>
      <circle cx="210" cy="250" r="4.5" fill="rgba(255,255,255,0.7)"/>
      <circle cx="150" cy="120" r="6" fill="#ffffff"/>
      <circle cx="250" cy="150" r="4.5" fill="rgba(255,255,255,0.6)"/>
      <circle cx="280" cy="190" r="5" fill="rgba(255,255,255,0.75)"/>
    </svg>
  </div>

  <!-- Right Form Panel -->
  <div class="form-panel">
    <div class="login-card">
      <div class="form-header">
        <h2>Register Company</h2>
        <p>Create your new tenant account</p>
      </div>

      <div class="error-banner" *ngIf="errorMessage()">
        <i class="fa-solid fa-circle-exclamation"></i>
        {{ errorMessage() }}
      </div>

      <form (ngSubmit)="onSubmit()" #registerForm="ngForm" autocomplete="off">
        <!-- Company Name Field -->
        <div class="form-group">
          <label for="companyName">Company Name</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-building"></i>
            <input 
              id="companyName"
              type="text" 
              [(ngModel)]="formData.companyName" 
              name="companyName" 
              required 
              placeholder="e.g. Acme Corp">
          </div>
        </div>

        <!-- Company Code Field -->
        <div class="form-group">
          <label for="companyCode">Company Code</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-tag"></i>
            <input 
              id="companyCode"
              type="text" 
              [(ngModel)]="formData.companyCode" 
              name="companyCode" 
              required 
              placeholder="e.g. ACME123">
          </div>
        </div>

        <!-- Admin Full Name Field -->
        <div class="form-group">
          <label for="hrName">Admin Full Name</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-user"></i>
            <input 
              id="hrName"
              type="text" 
              [(ngModel)]="formData.hrName" 
              name="hrName" 
              required 
              placeholder="e.g. Praveen">
          </div>
        </div>

        <!-- Admin Email Field -->
        <div class="form-group">
          <label for="hrEmail">Admin Email</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-envelope"></i>
            <input 
              id="hrEmail"
              type="email" 
              [(ngModel)]="formData.hrEmail" 
              name="hrEmail" 
              required 
              placeholder="admin@company.com">
          </div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="hrPassword">Password</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock"></i>
            <input 
              id="hrPassword"
              type="password" 
              [(ngModel)]="formData.hrPassword" 
              name="hrPassword" 
              required 
              placeholder="••••••••">
          </div>
        </div>

        <button type="submit" class="submit-btn" [disabled]="isLoading() || !registerForm.form.valid">
          <span *ngIf="!isLoading()">Register Account</span>
          <div class="spinner" *ngIf="isLoading()"></div>
        </button>

        <div class="form-footer">
          <a routerLink="/login">Already have an account? Sign in</a>
        </div>
      </form>
    </div>
  </div>
</div>
